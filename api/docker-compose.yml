version: '3.8'

services:
  nvr-server:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./recordings:/app/recordings
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RECORDINGS_DIR=/app/recordings
    restart: unless-stopped
    
